<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Aptitude Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin-exam-builder.css">
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <div class="header-top">
        <div class="brand-title">
          <p class="eyebrow">QUESTION BANK &amp; TESTS</p>
          <h1>Create AI-Proctored Aptitude Test</h1>
          <p class="subtitle">Design test structure, configure timing, and set up topics with MCQ options.</p>
        </div>
        <div class="header-nav">
          <a class="nav-btn" href="/pages/admindash.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home / Dashboard
          </a>
          <a class="nav-btn outline-nav" href="/pages/admin-exams.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Back to Tests
          </a>
        </div>
      </div>
    </header>

    <form id="examForm" class="exam-form-container">
      <!-- General Test Details Card -->
      <section class="card form-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          General Information
        </h2>

        <div class="form-group">
          <label for="title">Test Title</label>
          <input id="title" class="form-control" required maxlength="180" placeholder="Comprehensive Campus Recruitment Aptitude Test">
        </div>

        <div class="form-group">
          <label for="instructions">Instructions for Candidates</label>
          <textarea id="instructions" class="form-control" required rows="4" placeholder="Rules students must read before starting..."></textarea>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="durationMinutes">Duration (Minutes)</label>
            <input id="durationMinutes" class="form-control" type="number" min="1" required value="20">
          </div>

          <div class="form-group">
            <label for="startsAt">Starts At</label>
            <input id="startsAt" class="form-control" type="datetime-local" required>
          </div>

          <div class="form-group">
            <label for="endsAt">Ends At</label>
            <input id="endsAt" class="form-control" type="datetime-local" required>
          </div>

          <div class="form-group">
            <label for="negativeMarking">Negative Marks</label>
            <input id="negativeMarking" class="form-control" type="number" min="0" step="0.25" value="1">
          </div>
        </div>

        <div class="form-group">
          <label for="status">Publishing Status</label>
          <select id="status" class="form-control">
            <option value="draft">Draft</option>
            <option value="published">Publish Now</option>
          </select>
        </div>
      </section>

      <!-- Topics & MCQ Questions Section -->
      <section class="form-section">
        <div class="section-header">
          <h2>Topics &amp; MCQ Questions</h2>
          <p class="subtitle">Organize your exam by adding modules and specifying correct answers.</p>
        </div>

        <div id="topics" class="topics-list"></div>

        <button class="btn btn-outline add-topic-btn" type="button" id="addTopic">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Topic Module
        </button>
      </section>

      <div class="form-submit-bar">
        <button class="btn btn-primary btn-large" type="submit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save Aptitude Test
        </button>
      </div>
    </form>
  </main>

  <script src="/js/admin-exam-builder.js"></script>
</body>
</html>
