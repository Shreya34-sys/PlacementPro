<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live AI Proctoring</title>
  <link rel="stylesheet" href="/css/proctored-exams.css">
</head>
<body>
  <main class="shell proctor">
    <header>
      <p class="eyebrow danger">AUDIO-VISUAL INTEGRITY & SURVEILLANCE CONSOLE</p>
      <h1>Live AI Proctoring & Audio Surveillance Supervisor</h1>
      <p>Highest severity alerts and student feeds appear first.</p>
    </header>

    <section id="flagStats" class="metrics">
      <div><b>0</b><small>High severity</small></div>
      <div><b>0</b><small>Medium severity</small></div>
      <div><b>0</b><small>Low severity</small></div>
    </section>

    <section class="card">
      <h2>▣ Live Student Monitoring</h2>
      <div id="studentFeeds" class="feed-grid"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/proctoring-dashboard.js"></script>
</body>
</html>
