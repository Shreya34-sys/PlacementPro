<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PlacementPro</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/adminlogin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="admin-card">
        <div class="admin-icon-wrapper">
            <div class="shield-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11ZM9 12l2 2 4-4"/></svg></div>
        </div>
        
        <h2>Admin Login</h2>
        <p class="admin-subtitle">PlacementPro Administration</p>

        <!-- Admin Password Login Form -->
        <form id="adminLoginForm" novalidate>
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" class="admin-input" id="adminEmail" placeholder="abc@gmail.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" class="admin-input" id="adminPassword" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn-admin-submit">
                <span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4M12 15v3"/></svg></span> Login with Password
            </button>
        </form>

        <div class="divider"><span>OR</span></div>

        <!-- Magic Link Trigger Button -->
        <button type="button" class="btn-magic-link" id="btnMagicLink">
            <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg> Login with Magic Email Link
        </button>

        <div class="admin-footer">
            <a href="/login">&larr; Back to Student Login</a>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
